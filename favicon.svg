<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#1a1a1a"/>
  <!-- Paintbrush: top-left to bottom-right (\) -->
  <g transform="rotate(45,50,50)">
    <rect x="46" y="11" width="8" height="36" rx="4" fill="white"/>
    <rect x="44" y="46" width="12" height="5" rx="1" fill="#555"/>
    <path d="M44,51 Q41,66 50,74 Q59,66 56,51Z" fill="white"/>
  </g>
  <!-- Pencil: bottom-left to top-right (/) -->
  <g transform="rotate(-45,50,50)">
    <rect x="44" y="8" width="12" height="6" rx="3" fill="#888"/>
    <rect x="46" y="13" width="8" height="34" rx="3" fill="white"/>
    <rect x="44" y="46" width="12" height="5" rx="1" fill="#555"/>
    <polygon points="44,51 56,51 50,65" fill="white"/>
  </g>
</svg>
